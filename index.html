<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dasha</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8e5f3;color:#333;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.10)}h1{margin:0;color:#d93e99}.sub{color:#666;margin:5px 0 18px}.hidden{display:none!important}input,textarea,select,button{width:100%;padding:12px;border-radius:11px;font-size:15px;margin-top:9px}input,textarea,select{border:1px solid #ccc;background:#fff}button{border:0;background:#d93e99;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#6b5b95}.danger{background:#b00020}.good{background:#178a47}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{width:auto;padding:10px 14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top button{width:auto}.msg{margin-top:12px}.bad{color:#b00020}.ok{color:#14833b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:1px solid #eee;border-radius:14px;padding:14px;margin-top:12px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row button{width:auto}.task{padding:12px;border:1px solid #eee;border-radius:12px;margin-top:8px}.task.done{opacity:.6;text-decoration:line-through}.chat{height:290px;overflow:auto;border:1px solid #eee;border-radius:14px;padding:12px;background:#fff}.bubble{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:88%;white-space:pre-wrap}.me{margin-left:auto;background:#f3d4e8}.ai{background:#f2f2f2}.badge{display:inline-block;padding:4px 8px;border-radius:10px;background:#f3d4e8;font-size:12px}.users table{width:100%;border-collapse:collapse;margin-top:10px}.users th,.users td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.small{font-size:13px;color:#666}@media(max-width:650px){.grid{grid-template-columns:1fr}.users table{font-size:12px}.wrap{padding:10px}.card{padding:15px}}</style></head><body><div class="wrap"><div class="card"><div id="setup" class="hidden"><h1>Dasha</h1><div class="sub">Configuración inicial del administrador</div><input id="newpass" type="password" placeholder="Crea contraseña de administrador"><button onclick="saveAdmin()">Guardar y continuar</button><div id="setupmsg" class="msg"></div></div><div id="login" class="hidden"><h1>Dasha</h1><div class="sub">Tu asistente IA</div><input id="user" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña"><button onclick="doLogin()">Entrar</button><div id="loginmsg" class="msg"></div></div><div id="app" class="hidden"><div class="top"><div><h1>Dasha</h1><div class="small">Sesión: <b id="who"></b> <span id="rolebadge" class="badge"></span></div></div><button class="secondary" onclick="logout()">Salir</button></div><div class="tabs"><button onclick="tab('chat')">Chat</button><button onclick="tab('tasks')">Tareas</button><button id="adminUsersBtn" onclick="tab('users')">Usuarios</button><button id="adminCfgBtn" onclick="tab('config')">Configuración</button></div><section id="tab-chat"><div id="chatbox" class="chat"></div><textarea id="prompt" rows="3" placeholder="Escribe aquí lo que quieres que Dasha haga..."></textarea><button onclick="sendPrompt()">Enviar a Dasha</button></section><section id="tab-tasks" class="hidden"><div class="row"><input id="tasktext" placeholder="Nueva tarea"><button onclick="addTask()">Agregar</button></div><div id="tasklist"></div></section><section id="tab-users" class="hidden users"><h3>Control de usuarios</h3><div class="grid"><input id="nu" placeholder="Usuario nuevo"><input id="np" type="password" placeholder="Contraseña"><input id="nexp" type="date"><input id="nlim" type="number" min="1" value="30" placeholder="Límite diario"></div><div class="grid"><label><input id="pchat" type="checkbox" checked> Chat</label><label><input id="pdocs" type="checkbox" checked> Documentos</label></div><button onclick="createUser()">Crear usuario</button><div id="userlist"></div></section><section id="tab-config" class="hidden"><h3>Configuración del administrador</h3><input id="endpoint" placeholder="URL segura del servidor IA (se configurará aquí)"><button onclick="saveConfig()">Guardar configuración</button><div class="box"><b>Estado IA:</b> <span id="aistatus">Pendiente de servidor seguro</span><div class="small">La clave de OpenAI no se guarda en esta página. Se mantendrá únicamente en el servidor seguro.</div></div><button class="danger" onclick="changeAdminPass()">Cambiar contraseña del administrador</button></section></div></div></div><script>const enc=new TextEncoder();async function hash(s){const b=await crypto.subtle.digest('SHA-256',enc.encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}const $=id=>document.getElementById(id);function show(id){['setup','login','app'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function getUsers(){return JSON.parse(localStorage.getItem('dasha_users')||'[]')}function setUsers(v){localStorage.setItem('dasha_users',JSON.stringify(v))}async function saveAdmin(){let p=$('newpass').value;if(p.length<6){$('setupmsg').innerHTML='<span class="bad">Usa al menos 6 caracteres.</span>';return}localStorage.setItem('dasha_admin_hash',await hash(p));show('login')}async function doLogin(){let u=$('user').value.trim().toUpperCase(),p=$('pass').value,h=await hash(p);if(u==='LEONEL'&&h===localStorage.getItem('dasha_admin_hash')){startSession('LEONEL','admin');return}let users=getUsers(),x=users.find(z=>z.name===u&&z.hash===h);if(!x){$('loginmsg').innerHTML='<span class="bad">Usuario o contraseña incorrectos.</span>';return}if(!x.active){$('loginmsg').innerHTML='<span class="bad">Usuario bloqueado.</span>';return}if(x.exp&&new Date(x.exp+'T23:59:59')<new Date()){$('loginmsg').innerHTML='<span class="bad">Usuario vencido.</span>';return}let day=new Date().toISOString().slice(0,10);if(x.day!==day){x.day=day;x.used=0}if((x.used||0)>=x.limit){setUsers(users);$('loginmsg').innerHTML='<span class="bad">Límite diario alcanzado.</span>';return}setUsers(users);startSession(u,'user')}function startSession(u,r){sessionStorage.setItem('dasha_user',u);sessionStorage.setItem('dasha_role',r);openApp()}function logout(){sessionStorage.clear();show('login')}function openApp(){let u=sessionStorage.getItem('dasha_user'),r=sessionStorage.getItem('dasha_role');if(!u){show('login');return}show('app');$('who').textContent=u;$('rolebadge').textContent=r==='admin'?'ADMINISTRADOR':'USUARIO';$('adminUsersBtn').classList.toggle('hidden',r!=='admin');$('adminCfgBtn').classList.toggle('hidden',r!=='admin');renderTasks();renderUsers();renderChat();let ep=localStorage.getItem('dasha_endpoint')||'';$('endpoint').value=ep;$('aistatus').textContent=ep?'Servidor configurado':'Pendiente de servidor seguro'}function tab(n){['chat','tasks','users','config'].forEach(x=>$('tab-'+x).classList.toggle('hidden',x!==n));if(n==='users')renderUsers();if(n==='tasks')renderTasks()}function taskKey(){return 'dasha_tasks_'+sessionStorage.getItem('dasha_user')}function addTask(){let t=$('tasktext').value.trim();if(!t)return;let a=JSON.parse(localStorage.getItem(taskKey())||'[]');a.unshift({id:Date.now(),text:t,done:false});localStorage.setItem(taskKey(),JSON.stringify(a));$('tasktext').value='';renderTasks()}function toggleTask(id){let a=JSON.parse(localStorage.getItem(taskKey())||'[]');let x=a.find(z=>z.id===id);if(x)x.done=!x.done;localStorage.setItem(taskKey(),JSON.stringify(a));renderTasks()}function delTask(id){let a=JSON.parse(localStorage.getItem(taskKey())||'[]').filter(z=>z.id!==id);localStorage.setItem(taskKey(),JSON.stringify(a));renderTasks()}function renderTasks(){if(!$('tasklist'))return;let a=JSON.parse(localStorage.getItem(taskKey())||'[]');$('tasklist').innerHTML=a.length?a.map(x=>`<div class="task ${x.done?'done':''}"><b>${esc(x.text)}</b><div class="row"><button class="good" onclick="toggleTask(${x.id})">${x.done?'Reabrir':'Completar'}</button><button class="danger" onclick="delTask(${x.id})">Eliminar</button></div></div>`).join(''):'<div class="box small">No hay tareas todavía.</div>'}async function createUser(){if(sessionStorage.getItem('dasha_role')!=='admin')return;let n=$('nu').value.trim().toUpperCase(),p=$('np').value;if(!n||p.length<4){alert('Escribe usuario y contraseña de al menos 4 caracteres.');return}let a=getUsers();if(a.some(x=>x.name===n)||n==='LEONEL'){alert('Ese usuario ya existe.');return}a.push({name:n,hash:await hash(p),active:true,exp:$('nexp').value,limit:+$('nlim').value||30,used:0,day:'',chat:$('pchat').checked,docs:$('pdocs').checked});setUsers(a);$('nu').value='';$('np').value='';renderUsers()}function toggleUser(n){let a=getUsers(),x=a.find(z=>z.name===n);if(x)x.active=!x.active;setUsers(a);renderUsers()}function delUser(n){if(!confirm('¿Eliminar '+n+'?'))return;setUsers(getUsers().filter(x=>x.name!==n));renderUsers()}function renderUsers(){if(!$('userlist')||sessionStorage.getItem('dasha_role')!=='admin')return;let a=getUsers();$('userlist').innerHTML=a.length?'<table><tr><th>Usuario</th><th>Estado</th><th>Límite</th><th>Acción</th></tr>'+a.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.active?'Activo':'Bloqueado'}</td><td>${x.limit}/día</td><td><button onclick="toggleUser('${x.name}')">${x.active?'Bloquear':'Activar'}</button><button class="danger" onclick="delUser('${x.name}')">Eliminar</button></td></tr>`).join('')+'</table>':'<div class="box small">Aún no hay usuarios creados.</div>'}function chatKey(){return 'dasha_chat_'+sessionStorage.getItem('dasha_user')}function getChat(){return JSON.parse(localStorage.getItem(chatKey())||'[]')}function saveChat(a){localStorage.setItem(chatKey(),JSON.stringify(a.slice(-100)))}function renderChat(){if(!$('chatbox'))return;let a=getChat();$('chatbox').innerHTML=a.length?a.map(x=>`<div class="bubble ${x.who==='me'?'me':'ai'}">${esc(x.text)}</div>`).join(''):'<div class="small">Escribe una tarea o pregunta para Dasha.</div>';$('chatbox').scrollTop=$('chatbox').scrollHeight}async function sendPrompt(){let q=$('prompt').value.trim();if(!q)return;let u=sessionStorage.getItem('dasha_user'),r=sessionStorage.getItem('dasha_role');if(r!=='admin'){let a=getUsers(),x=a.find(z=>z.name===u);if(!x||!x.chat){alert('El administrador no te dio permiso para usar el chat.');return}let day=new Date().toISOString().slice(0,10);if(x.day!==day){x.day=day;x.used=0}if((x.used||0)>=x.limit){alert('Límite diario alcanzado.');return}x.used=(x.used||0)+1;setUsers(a)}let c=getChat();c.push({who:'me',text:q});saveChat(c);$('prompt').value='';renderChat();let ep=localStorage.getItem('dasha_endpoint')||'';if(!ep){c.push({who:'ai',text:'El chat está listo, pero falta conectar el servidor seguro de IA. El administrador debe configurarlo una sola vez.'});saveChat(c);renderChat();return}try{let res=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,message:q})});let data=await res.json();c.push({who:'ai',text:data.reply||data.message||'Respuesta recibida.'})}catch(e){c.push({who:'ai',text:'No pude conectar con el servidor de IA. Revisa la configuración del administrador.'})}saveChat(c);renderChat()}function saveConfig(){if(sessionStorage.getItem('dasha_role')!=='admin')return;let v=$('endpoint').value.trim();localStorage.setItem('dasha_endpoint',v);$('aistatus').textContent=v?'Servidor configurado':'Pendiente de servidor seguro';alert('Configuración guardada.')}async function changeAdminPass(){if(sessionStorage.getItem('dasha_role')!=='admin')return;let p=prompt('Nueva contraseña del administrador:');if(!p||p.length<6){alert('Debe tener al menos 6 caracteres.');return}localStorage.setItem('dasha_admin_hash',await hash(p));alert('Contraseña actualizada.')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if(sessionStorage.getItem('dasha_user'))openApp();else if(localStorage.getItem('dasha_admin_hash'))show('login');else show('setup');</script></body></html>
