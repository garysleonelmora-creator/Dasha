<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dasha</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f8e5f3;color:#333;display:flex;min-height:100vh;align-items:center;justify-content:center}.card{width:min(92%,420px);background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.12)}h1{margin:0 0 8px;color:#d93e99;text-align:center;font-size:34px}.sub{text-align:center;margin-bottom:24px;color:#666}input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:12px;font-size:16px}input{border:1px solid #ccc}button{border:0;background:#d93e99;color:#fff;font-weight:700}.msg{margin-top:14px;text-align:center}.ok{color:#14833b}.bad{color:#b00020}.hidden{display:none}.welcome{text-align:center;font-size:18px;line-height:1.5}</style></head><body><div class="card"><div id="setup" class="hidden"><h1>Dasha</h1><div class="sub">Configuración inicial</div><input id="newpass" type="password" placeholder="Crea tu contraseña de administrador"><button onclick="savePass()">Guardar contraseña</button><div id="setupmsg" class="msg"></div></div><div id="login" class="hidden"><h1>Dasha</h1><div class="sub">Tu asistente IA</div><input id="user" value="LEONEL" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button><div id="loginmsg" class="msg"></div></div><div id="home" class="hidden"><h1>Dasha</h1><div class="welcome"><b>Dasha está funcionando.</b><br><br>Sesión iniciada como administrador.</div><button onclick="logout()">Cerrar sesión</button></div></div><script>const enc=new TextEncoder();async function hash(s){const b=await crypto.subtle.digest('SHA-256',enc.encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function show(id){for(const x of ['setup','login','home'])document.getElementById(x).classList.add('hidden');document.getElementById(id).classList.remove('hidden')}async function savePass(){const p=document.getElementById('newpass').value;if(p.length<6){document.getElementById('setupmsg').innerHTML='<span class="bad">Usa al menos 6 caracteres.</span>';return}localStorage.setItem('dasha_admin_hash',await hash(p));show('login')}async function login(){const u=document.getElementById('user').value.trim().toUpperCase(),p=document.getElementById('pass').value,h=localStorage.getItem('dasha_admin_hash');if(u==='LEONEL'&&h===await hash(p)){sessionStorage.setItem('dasha_ok','1');show('home')}else document.getElementById('loginmsg').innerHTML='<span class="bad">Usuario o contraseña incorrectos.</span>'}function logout(){sessionStorage.removeItem('dasha_ok');show('login')}if(sessionStorage.getItem('dasha_ok')==='1')show('home');else if(localStorage.getItem('dasha_admin_hash'))show('login');else show('setup');</script></body></html>
