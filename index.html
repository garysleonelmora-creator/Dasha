<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Ingeniería IA</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#0f172a;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 30px #00000012}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:12px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800}h1{margin:0;font-size:28px}.sub,.small{color:#64748b}.hidden{display:none!important}input,textarea,select,button{width:100%;padding:12px;border-radius:10px;font-size:15px;margin-top:9px}input,textarea,select{border:1px solid #cbd5e1;background:#fff}button{border:0;background:#0f172a;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#334155}.danger{background:#b91c1c}.good{background:#15803d}.blue{background:#1d4ed8}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{width:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top>button{width:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid #e2e8f0;border-radius:13px;padding:13px;margin-top:12px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row button{width:auto}.chat{height:330px;overflow:auto;border:1px solid #e2e8f0;border-radius:13px;padding:12px;background:#f8fafc}.bubble{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:90%;white-space:pre-wrap}.me{margin-left:auto;background:#dbeafe}.ai{background:#fff;border:1px solid #e2e8f0}.task{padding:12px;border:1px solid #e2e8f0;border-radius:12px;margin-top:8px}.task.done{opacity:.55;text-decoration:line-through}.badge{display:inline-block;background:#e2e8f0;padding:4px 8px;border-radius:999px;font-size:12px}.status{font-weight:700}.ok{color:#15803d}.bad{color:#b91c1c}.users table{width:100%;border-collapse:collapse;margin-top:10px}.users th,.users td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:8px}.card{padding:14px}.top{align-items:flex-start}}</style></head><body><div class="wrap"><div class="card"><div id="setup" class="hidden"><div class="brand"><div class="logo">IA</div><div><h1>Ingeniería IA</h1><div class="sub">Configuración inicial</div></div></div><input id="newpass" type="password" placeholder="Crea contraseña de administrador"><button onclick="saveAdmin()">Guardar y continuar</button><div id="setupmsg" class="small"></div></div><div id="login" class="hidden"><div class="brand"><div class="logo">IA</div><div><h1>Ingeniería IA</h1><div class="sub">Asistente inteligente</div></div></div><input id="user" value="LEONEL" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña"><button onclick="doLogin()">Entrar</button><div id="loginmsg" class="small"></div></div><div id="app" class="hidden"><div class="top"><div class="brand"><div class="logo">IA</div><div><h1>Ingeniería IA</h1><div class="small">Sesión: <b id="who"></b> <span id="rolebadge" class="badge"></span></div></div></div><button class="secondary" onclick="logout()">Salir</button></div><div class="tabs"><button onclick="tab('chat')">Chat</button><button onclick="tab('tasks')">Tareas</button><button onclick="tab('images')">Imágenes</button><button id="adminUsersBtn" onclick="tab('users')">Usuarios</button><button id="adminCfgBtn" onclick="tab('config')">Configuración</button></div><section id="tab-chat"><div id="serverBanner" class="box small">Comprobando servidor...</div><div id="chatbox" class="chat"></div><textarea id="prompt" rows="3" placeholder="Escribe tu consulta o tarea..."></textarea><button class="blue" onclick="sendPrompt()">Enviar</button></section><section id="tab-tasks" class="hidden"><div class="row"><input id="tasktext" placeholder="Nueva tarea"><button onclick="addTask()">Agregar</button></div><div id="tasklist"></div></section><section id="tab-images" class="hidden"><h3>Herramientas de imagen</h3><div class="grid"><div class="box"><b>Generar imagen</b><textarea id="imgprompt" rows="3" placeholder="Describe la imagen que quieres crear"></textarea><button onclick="imageNotice()">Generar</button></div><div class="box"><b>Editar imagen</b><input type="file" accept="image/*"><select><option>Quitar fondo</option><option>Mejorar calidad</option><option>Restaurar foto</option><option>Mejorar logo</option></select><button onclick="imageNotice()">Procesar</button></div></div><div id="imgmsg" class="small"></div></section><section id="tab-users" class="hidden users"><h3>Control de usuarios</h3><div class="grid"><input id="nu" placeholder="Usuario nuevo"><input id="np" type="password" placeholder="Contraseña"><input id="nexp" type="date"><input id="nlim" type="number" min="1" value="30" placeholder="Límite diario"></div><button onclick="createUser()">Crear usuario</button><div id="userlist"></div></section><section id="tab-config" class="hidden"><h3>Configuración del administrador</h3><div class="box"><b>Servidor IA</b><div id="aistatus" class="status">Comprobando...</div><div class="small" id="serverurl"></div><button class="secondary" onclick="checkServer()">Probar conexión</button></div><button class="danger" onclick="changeAdminPass()">Cambiar contraseña del administrador</button></section></div></div></div><script>const $=id=>document.getElementById(id),enc=new TextEncoder();const DEFAULT_ENDPOINT='https://wireless-lasting-assembler--garysleonelmora.replit.app/api/chat';async function hash(s){let b=await crypto.subtle.digest('SHA-256',enc.encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function show(id){['setup','login','app'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function getUsers(){return JSON.parse(localStorage.getItem('dasha_users')||'[]')}function setUsers(v){localStorage.setItem('dasha_users',JSON.stringify(v))}async function saveAdmin(){let p=$('newpass').value;if(p.length<6){$('setupmsg').textContent='Usa al menos 6 caracteres.';return}localStorage.setItem('dasha_admin_hash',await hash(p));show('login')}async function doLogin(){let u=$('user').value.trim().toUpperCase(),h=await hash($('pass').value);if(u==='LEONEL'&&h===localStorage.getItem('dasha_admin_hash'))return startSession(u,'admin');let x=getUsers().find(z=>z.name===u&&z.hash===h);if(!x||!x.active){$('loginmsg').textContent='Usuario o contraseña incorrectos.';return}startSession(u,'user')}function startSession(u,r){sessionStorage.setItem('dasha_user',u);sessionStorage.setItem('dasha_role',r);openApp()}function logout(){sessionStorage.clear();show('login')}function openApp(){let u=sessionStorage.getItem('dasha_user'),r=sessionStorage.getItem('dasha_role');if(!u)return show('login');show('app');$('who').textContent=u;$('rolebadge').textContent=r==='admin'?'ADMINISTRADOR':'USUARIO';$('adminUsersBtn').classList.toggle('hidden',r!=='admin');$('adminCfgBtn').classList.toggle('hidden',r!=='admin');$('serverurl').textContent=DEFAULT_ENDPOINT;renderChat();renderTasks();renderUsers();checkServer()}function tab(n){['chat','tasks','images','users','config'].forEach(x=>$('tab-'+x).classList.toggle('hidden',x!==n));if(n==='users')renderUsers();if(n==='tasks')renderTasks();if(n==='config')checkServer()}async function checkServer(){let health=DEFAULT_ENDPOINT.replace('/api/chat','/api/health');setStatus('Comprobando conexión...','');try{let r=await fetch(health,{method:'GET',cache:'no-store'});let txt=await r.text();if(r.ok){setStatus('Servidor conectado','ok');$('serverBanner').innerHTML='<span class="ok"><b>Servidor conectado</b></span>'}else{setStatus('Servidor respondió con error '+r.status,'bad');$('serverBanner').innerHTML='<span class="bad"><b>Servidor no disponible.</b></span> '+esc(txt.slice(0,120))}}catch(e){setStatus('Sin conexión con el servidor','bad');$('serverBanner').innerHTML='<span class="bad"><b>No se pudo conectar al servidor.</b></span>'}}function setStatus(t,c){$('aistatus').textContent=t;$('aistatus').className='status '+c}function taskKey(){return'dasha_tasks_'+sessionStorage.getItem('dasha_user')}function addTask(){let t=$('tasktext').value.trim();if(!t)return;let a=JSON.parse(localStorage.getItem(taskKey())||'[]');a.unshift({id:Date.now(),text:t,done:false});localStorage.setItem(taskKey(),JSON.stringify(a));$('tasktext').value='';renderTasks()}function toggleTask(id){let a=JSON.parse(localStorage.getItem(taskKey())||'[]'),x=a.find(z=>z.id===id);if(x)x.done=!x.done;localStorage.setItem(taskKey(),JSON.stringify(a));renderTasks()}function delTask(id){localStorage.setItem(taskKey(),JSON.stringify(JSON.parse(localStorage.getItem(taskKey())||'[]').filter(z=>z.id!==id)));renderTasks()}function renderTasks(){if(!$('tasklist'))return;let a=JSON.parse(localStorage.getItem(taskKey())||'[]');$('tasklist').innerHTML=a.length?a.map(x=>`<div class="task ${x.done?'done':''}"><b>${esc(x.text)}</b><div class="row"><button class="good" onclick="toggleTask(${x.id})">${x.done?'Reabrir':'Completar'}</button><button class="danger" onclick="delTask(${x.id})">Eliminar</button></div></div>`).join(''):'<div class="box small">No hay tareas.</div>'}async function createUser(){let n=$('nu').value.trim().toUpperCase(),p=$('np').value;if(!n||p.length<4)return alert('Escribe usuario y contraseña.');let a=getUsers();if(a.some(x=>x.name===n)||n==='LEONEL')return alert('Ese usuario ya existe.');a.push({name:n,hash:await hash(p),active:true,exp:$('nexp').value,limit:+$('nlim').value||30});setUsers(a);$('nu').value='';$('np').value='';renderUsers()}function toggleUser(n){let a=getUsers(),x=a.find(z=>z.name===n);if(x)x.active=!x.active;setUsers(a);renderUsers()}function delUser(n){setUsers(getUsers().filter(x=>x.name!==n));renderUsers()}function renderUsers(){if(!$('userlist')||sessionStorage.getItem('dasha_role')!=='admin')return;let a=getUsers();$('userlist').innerHTML=a.length?'<table><tr><th>Usuario</th><th>Estado</th><th>Acción</th></tr>'+a.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.active?'Activo':'Bloqueado'}</td><td><button onclick="toggleUser('${x.name}')">${x.active?'Bloquear':'Activar'}</button><button class="danger" onclick="delUser('${x.name}')">Eliminar</button></td></tr>`).join('')+'</table>':'<div class="box small">Aún no hay usuarios.</div>'}function chatKey(){return'dasha_chat_'+sessionStorage.getItem('dasha_user')}function getChat(){return JSON.parse(localStorage.getItem(chatKey())||'[]')}function saveChat(a){localStorage.setItem(chatKey(),JSON.stringify(a.slice(-100)))}function renderChat(){let a=getChat();$('chatbox').innerHTML=a.length?a.map(x=>`<div class="bubble ${x.who==='me'?'me':'ai'}">${esc(x.text)}</div>`).join(''):'<div class="small">Escribe una consulta para Ingeniería IA.</div>';$('chatbox').scrollTop=$('chatbox').scrollHeight}async function sendPrompt(){let q=$('prompt').value.trim();if(!q)return;let c=getChat();c.push({who:'me',text:q});saveChat(c);$('prompt').value='';renderChat();c.push({who:'ai',text:'Conectando...'});saveChat(c);renderChat();try{let r=await fetch(DEFAULT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:sessionStorage.getItem('dasha_user'),message:q})});let text=await r.text(),d={};try{d=JSON.parse(text)}catch{}c.pop();if(!r.ok)c.push({who:'ai',text:d.message||d.error||('Error del servidor: '+r.status)});else c.push({who:'ai',text:d.reply||d.message||text||'Respuesta recibida.'})}catch(e){c.pop();c.push({who:'ai',text:'No pude conectar con el servidor de IA. El servidor está fuera de línea o todavía no terminó de publicar.'})}saveChat(c);renderChat()}function imageNotice(){$('imgmsg').textContent='El módulo de imágenes se activará cuando el servicio de imágenes esté conectado al servidor.'}async function changeAdminPass(){let p=prompt('Nueva contraseña:');if(!p||p.length<6)return;localStorage.setItem('dasha_admin_hash',await hash(p));alert('Contraseña actualizada.')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if(sessionStorage.getItem('dasha_user'))openApp();else if(localStorage.getItem('dasha_admin_hash'))show('login');else show('setup');</script></body></html>
